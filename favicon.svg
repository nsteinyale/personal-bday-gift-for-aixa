<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170">
  <!-- Aixa's Adventures: a clip-art adventurer's fedora resting on a folded treasure map -->
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8774a"/><stop offset="1" stop-color="#6b4526"/></linearGradient>
  </defs>
  <!-- the map: three folded panels of old parchment -->
  <g stroke="#6b4a26" stroke-width="4" stroke-linejoin="round">
    <path d="M30 92 L88 80 L88 160 L30 168 Z" fill="#f3dfa6"/>
    <path d="M88 80 L152 92 L152 168 L88 160 Z" fill="#e8cf8c"/>
    <path d="M152 92 L210 80 L210 160 L152 168 Z" fill="#f3dfa6"/>
  </g>
  <!-- a bit of coast, a dotted route and the X -->
  <path d="M40 150 C 52 128, 70 140, 80 118 M164 106 C 180 116, 186 98, 200 104" fill="none" stroke="#5aa3c9" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 136 C 80 104, 120 150, 150 120 S 182 112, 190 132" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="3 7" stroke-linecap="round"/>
  <path d="M182 124 l14 14 M196 124 l-14 14" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- the fedora on top -->
  <ellipse cx="120" cy="70" rx="92" ry="20" fill="url(#felt)" stroke="#3b2414" stroke-width="5"/>
  <path d="M64 68 C 66 26, 92 14, 104 26 C 112 18, 128 18, 136 26 C 148 14, 174 26, 176 68 Z" fill="url(#felt)" stroke="#3b2414" stroke-width="5" stroke-linejoin="round"/>
  <path d="M104 26 C 112 38, 128 38, 136 26" fill="none" stroke="#3b2414" stroke-width="4" stroke-linecap="round"/>
  <path d="M66 54 C 100 64, 140 64, 174 54 L175 66 C 140 76, 100 76, 65 66 Z" fill="#c0392b" stroke="#3b2414" stroke-width="4" stroke-linejoin="round"/>
  <path d="M40 74 C 70 84, 110 86, 150 82" fill="none" stroke="#d9a877" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
